<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evening Breath</title>
<style>
  :root {
    --ink: #f3e9dc;
    --muted: #b9a893;
    --panel: rgba(16, 12, 10, 0.72);
    --edge: rgba(243, 233, 220, 0.14);
    --gold: #ffd04a;
    --teal: #26e5ef;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0a0d;
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; left: 16px; bottom: 16px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    max-width: calc(100vw - 32px);
  }
  #hud .hint { color: var(--muted); font-size: 12px; }
  button {
    font: inherit; font-size: 13px;
    color: var(--ink);
    background: rgba(255, 208, 74, 0.10);
    border: 1px solid rgba(255, 208, 74, 0.35);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover { background: rgba(255, 208, 74, 0.20); }
  button[aria-pressed="true"] { background: rgba(255, 208, 74, 0.28); }

  #title {
    position: fixed; left: 16px; top: 16px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    max-width: calc(100vw - 32px);
  }
  #title h1 { margin: 0; font-size: 15px; letter-spacing: 0.02em; font-weight: 600; }
  #title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  #loading {
    position: fixed; inset: 0;
    display: grid; place-content: center; gap: 10px; justify-items: center;
    background: #0b0a0d; z-index: 10; text-align: center; padding: 24px;
  }
  #bar { width: min(260px, 70vw); height: 3px; background: rgba(243,233,220,.14); border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--teal)); }
  #loading p { margin: 0; color: var(--muted); font-size: 13px; }
  body.cine #hud, body.cine #title { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1>Evening Breath</h1>
  <p>Drag to orbit · scroll to zoom · right-drag to pan</p>
</div>

<div id="hud">
  <button id="play">Play flythrough</button>
  <button id="hero">Hero shot</button>
  <span class="hint">WebGL preview of the Cycles scene</span>
</div>

<div id="loading"><div id="bar"><i></i></div><p id="loadtext">Loading scene…</p></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ---------------------------------------------------------------- palette --
// Same values as CONVENTIONS.md, so the WebGL preview and the Cycles render
// are lit from one set of numbers.
const SUN_GOLD   = 0xffb45c;
const GOLD_LAW   = 0xffd04a;
const UNDERLOOM  = 0xff400e;
const TEAL_CRACK = 0x26e5ef;

const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// The Cycles stills use view_transform="Standard" (no roll-off), and the
// first attempt mirrored that with NoToneMapping -- which blew the whole
// frame to white. Cycles' physically-based falloff and three's light units
// are not the same scale, so "no tone mapping" here means every highlight
// clips at once with nothing to recover it. ACES filmic gives the roll-off
// that makes a real-time approximation survivable; the trade is that it is
// slightly less saturated than the stills.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
const QS = new URLSearchParams(location.search);
const FAST = QS.get('fast') === '1';   // software-GL capture mode
renderer.shadowMap.enabled = !FAST;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (FAST) renderer.setPixelRatio(1);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(54, innerWidth / innerHeight, 0.05, 2000);
camera.position.set(-0.10, 0.95, 8.80);

// ------------------------------------------------------------------- sky --
// Vertical gradient keyed off the view ray's Y, mirroring build_sky() in
// scene_main.py (which had to be written by hand there because the studio
// helper assumes Blender's native Z-up while this scene is Y-up).
const skyGeo = new THREE.SphereGeometry(900, 32, 24);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {},
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vP;
    vec3 ramp(float t){
      vec3 c0 = vec3(0.620,0.340,0.220);   // cloud sea in shadow
      vec3 c1 = vec3(1.000,0.520,0.190);   // the sunset band
      vec3 c2 = vec3(0.880,0.420,0.300);
      vec3 c3 = vec3(0.420,0.270,0.390);   // dusk transition
      vec3 c4 = vec3(0.055,0.075,0.185);   // deep blue zenith
      if(t<0.33) return mix(c0,c1,t/0.33);
      if(t<0.46) return mix(c1,c2,(t-0.33)/0.13);
      if(t<0.62) return mix(c2,c3,(t-0.46)/0.16);
      return mix(c3,c4,clamp((t-0.62)/0.38,0.0,1.0));
    }
    void main(){
      float y = normalize(vP).y;
      float t = clamp((y + 0.30) / 0.70, 0.0, 1.0);
      gl_FragColor = vec4(ramp(t), 1.0);
    }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));
scene.fog = new THREE.FogExp2(0xd98a4e, 0.0075);

// ---------------------------------------------------------------- lights --
// glTF carries no lights by design here; these mirror scene_main.py's rig.
const key = new THREE.DirectionalLight(SUN_GOLD, 2.0);        // behind-left gold
key.position.set(-16, 7.5, -13);
key.castShadow = !FAST;
key.shadow.mapSize.set(FAST ? 512 : 2048, FAST ? 512 : 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 70;
key.shadow.camera.left = -22; key.shadow.camera.right = 22;
key.shadow.camera.top = 22; key.shadow.camera.bottom = -22;
key.shadow.bias = -0.0012;
scene.add(key);

const rim = new THREE.DirectionalLight(0xffd68c, 0.7);
rim.position.set(-9, 11, -8);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0xc2d0f0, UNDERLOOM, 0.35));

const under = new THREE.PointLight(UNDERLOOM, 70, 26, 2);     // hell below the glass
under.position.set(0.4, -2.6, 2.0);
scene.add(under);

const glyphSpill = new THREE.PointLight(GOLD_LAW, 26, 18, 2);
glyphSpill.position.set(0, 3.6, -7.2);
scene.add(glyphSpill);

const chaosGlow = new THREE.PointLight(TEAL_CRACK, 10, 9, 2);
chaosGlow.position.set(2.2, 1.7, 1.5);
scene.add(chaosGlow);

const lysKick = new THREE.PointLight(0xffc07f, 12, 8, 2);
lysKick.position.set(-3.0, 1.4, 5.6);
scene.add(lysKick);

// --------------------------------------------------------------- compose --
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomRes = FAST ? new THREE.Vector2(innerWidth * 0.5, innerHeight * 0.5)
                      : new THREE.Vector2(innerWidth, innerHeight);
const bloom = new UnrealBloomPass(bloomRes, 0.34, 0.68, 0.95);
composer.addPass(bloom);

// --------------------------------------------------------- camera moves ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0.20, 1.50, 2.10);
controls.minDistance = 1.2;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.497;   // don't dip under the crystal floor
controls.update();

const HERO = { pos: new THREE.Vector3(-0.10, 0.95, 8.80), tgt: new THREE.Vector3(0.20, 1.70, 2.10) };

// A tour that shows the scene rather than just spinning it: wide
// establishing, down to the hero angle, a low push past the severed head,
// around Lys, through and behind the gate, then back out wide.
const WAY = [
  { p: [ 15.0,  9.5,  19.0], t: [ 0.0, 2.2,  0.5] },
  { p: [  7.5,  5.0,  16.5], t: [ 0.4, 1.9,  1.2] },
  { p: [ -0.1,  0.95,  8.8], t: [ 0.2, 1.7,  2.1] },
  { p: [  0.4,  0.52,  5.0], t: [ 0.1, 0.34, 2.95] },
  { p: [ -3.4,  1.10,  6.2], t: [-1.4, 1.25, 3.3] },
  { p: [ -6.6,  2.60,  3.0], t: [-1.0, 1.60, 1.0] },
  { p: [ -7.4,  4.10, -4.5], t: [ 0.0, 2.60,-8.0] },
  { p: [  0.0,  5.20,-15.5], t: [ 0.0, 2.40,-8.4] },
  { p: [  8.2,  4.40, -4.0], t: [ 1.6, 2.00,  1.5] },
  { p: [  6.0,  2.10,  7.0], t: [ 2.2, 1.70,  1.5] },
  { p: [  0.2,  1.30, 11.0], t: [ 0.2, 1.60,  2.0] },
  { p: [ 13.0,  8.0,  18.0], t: [ 0.2, 2.0,   0.5] },
];
const curveP = new THREE.CatmullRomCurve3(WAY.map(w => new THREE.Vector3(...w.p)), false, 'catmullrom', 0.4);
const curveT = new THREE.CatmullRomCurve3(WAY.map(w => new THREE.Vector3(...w.t)), false, 'catmullrom', 0.4);

let cineMode = false;
function setT(t) {
  t = Math.min(Math.max(t, 0), 1);
  // ease the very ends so the move starts and stops rather than snapping
  const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  camera.position.copy(curveP.getPoint(e));
  const tgt = curveT.getPoint(e);
  camera.lookAt(tgt);
  controls.target.copy(tgt);
}

function goHero() {
  cineMode = false;
  document.body.classList.remove('cine');
  camera.position.copy(HERO.pos);
  controls.target.copy(HERO.tgt);
  controls.update();
}

let playing = false, playStart = 0;
const PLAY_SECONDS = 26;
document.getElementById('play').addEventListener('click', () => {
  playing = !playing;
  playStart = performance.now();
  document.getElementById('play').setAttribute('aria-pressed', String(playing));
  document.getElementById('play').textContent = playing ? 'Stop' : 'Play flythrough';
});
document.getElementById('hero').addEventListener('click', goHero);

// ------------------------------------------------------------------ load --
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('./vendor/addons/libs/draco/gltf/');
loader.setDRACOLoader(draco);

const bar = document.querySelector('#bar i');
const loadtext = document.getElementById('loadtext');

loader.load('./evening_breath.glb', (gltf) => {
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = !FAST;
      o.receiveShadow = !FAST;
      const m = o.material;
      if (m) {
        m.side = THREE.FrontSide;
        // Blender's exporter writes emissive strength through an extension
        // three may not apply; re-assert it so glyphs/cracks/eyes glow.
        if (m.emissive && m.userData && m.userData.emissiveStrength) {
          m.emissiveIntensity = m.userData.emissiveStrength;
        }
        // The Underloom is a large emissive mass sitting below the crystal
        // floor. In Cycles it reads as a glow seen THROUGH glass; in WebGL,
        // with no volumetric attenuation between it and the lens, bloom
        // turns it into one blown white blob that eats the frame. Damp it
        // here rather than globally, so the glyphs and cracks keep theirs.
        if (/under/i.test(m.name || '')) {
          m.emissiveIntensity = (m.emissiveIntensity || 1) * 0.22;
        }
      }
    }
  });
  scene.add(gltf.scene);
  document.getElementById('loading').style.display = 'none';
  window.__ready = true;
}, (ev) => {
  if (ev.total) {
    const pct = Math.round(ev.loaded / ev.total * 100);
    bar.style.width = pct + '%';
    loadtext.textContent = `Loading scene… ${pct}%`;
  } else {
    loadtext.textContent = `Loading scene… ${(ev.loaded / 1e6).toFixed(1)} MB`;
  }
}, (err) => {
  loadtext.textContent = 'Failed to load scene: ' + err;
  window.__error = String(err);
});

// -------------------------------------------------------------- the loop --
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

function frame() {
  requestAnimationFrame(frame);
  if (playing) {
    const t = ((performance.now() - playStart) / 1000) / PLAY_SECONDS;
    if (t >= 1) { playing = false; document.getElementById('play').textContent = 'Play flythrough'; document.getElementById('play').setAttribute('aria-pressed', 'false'); }
    else setT(t);
  } else if (!cineMode) {
    controls.update();
  }
  composer.render();
}
frame();

// Deterministic hook for offline frame capture: the recorder sets an exact
// t and renders one frame, rather than trusting wall-clock timing in a
// headless browser where frame pacing is not real-time.
window.__cine = {
  setT(t) {
    cineMode = true;
    playing = false;
    document.body.classList.add('cine');
    setT(t);
    composer.render();
  },
  hero: goHero,
};
</script>
</body>
</html>
