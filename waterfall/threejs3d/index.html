<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CraftFlow — Waterfall (3D raymarched / WebGL)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #020403; overflow: hidden; }
  canvas {
    display: block; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font: 12px/1.5 "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
    color: #aef0d8; background: rgba(6,12,10,0.72); border: 1px solid #1f4a3a;
    padding: 10px 12px; border-radius: 6px; backdrop-filter: blur(4px);
    max-width: 320px; pointer-events: none;
  }
  #hud b { color: #6cf0b0; }
  #hud .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #hud .k { opacity: 0.65; }
  #err {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ff8080; background: #0a0a0a; font: 13px monospace; padding: 24px; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div id="hud">
    <div><b>CRAFTFLOW 3D</b> · raymarched SDF · pure math, no meshes/textures</div>
    <div class="row"><span class="k">drag to orbit</span> · <span class="k">scroll to zoom</span></div>
    <div class="row"><span class="k">internal res</span><span id="resVal">—</span></div>
    <div class="row"><span class="k">fps</span><span id="fpsVal">—</span></div>
  </div>
  <div id="err"></div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
